name: Build and publish website

on:
  push:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4

      - name: Check out current published assets
        uses: actions/checkout@v4
        with:
          ref: main
          path: published

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install --global pnpm@10

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Build static site
        working-directory: source
        run: pnpm run build:pages

      - name: Restore unchanged public assets
        run: |
          cp -rn published/images source/out/
          mkdir -p source/out/archive
          cp -rn published/archive/. source/out/archive/
          for file in favicon.svg file.svg globe.svg og.png window.svg; do
            if [ -f "published/$file" ]; then cp -n "published/$file" source/out/; fi
          done
          touch source/out/.nojekyll

      - name: Publish to main
        working-directory: source/out
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Publish website"
          git branch -M main
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin main
